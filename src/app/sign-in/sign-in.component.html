<div class="auth-page">
  <mat-card class="auth-card">
    <div class="auth-brand">
      <span class="auth-mark"><mat-icon>event_available</mat-icon></span>
      <h1>{{ appName }}</h1>
      <p>Sign in to continue</p>
    </div>
    <form class="form-stack" [formGroup]="LoginForm" (ngSubmit)="onLogin()">
      <mat-form-field appearance="outline">
        <mat-label>Sign in as</mat-label>
        <mat-select formControlName="user_role">
          @for (roles of role; track roles.id) {
            <mat-option [value]="roles.id">{{ roles.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <mat-icon matPrefix>person</mat-icon>
        <input matInput type="text" formControlName="email_address" autocomplete="username" required>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput [type]="showPass" formControlName="password" autocomplete="current-password" required>
        <button matIconButton matSuffix type="button" (click)="togglePassword()"
          [attr.aria-label]="showPass == 'password' ? 'Show password' : 'Hide password'">
          <mat-icon>{{ showPass == 'password' ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>
      <button matButton="filled" type="submit">Login</button>
    </form>
    <div class="auth-links">
      <a routerLink="/new-register">Register as a new member</a>
      <a routerLink="/upcoming">See upcoming activities</a>
    </div>
  </mat-card>
</div>
