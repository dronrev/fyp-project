<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Upcoming activities</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (myEvent?.length) {
      <mat-list>
        @for (item of myEvent; track item) {
          <mat-list-item>
            <mat-icon matListItemIcon>event</mat-icon>
            <span matListItemTitle>{{ item.name_activity | titlecase }}</span>
            <span matListItemLine>{{ item.date | date }}</span>
          </mat-list-item>
        }
      </mat-list>
    } @else {
      <p class="empty-state">No upcoming activities.</p>
    }
  </mat-card-content>
</mat-card>
