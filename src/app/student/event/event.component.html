<div class="page-header">
  <h1 class="page-title">Events</h1>
  <a matButton="filled" routerLink="./add-event">
    <mat-icon>add</mat-icon>
    Set new activity
  </a>
</div>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="activities || []">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>No</th>
        <td mat-cell *matCellDef="let activity; let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let activity">{{ activity.name_activity | titlecase }}</td>
      </ng-container>
      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef>Location</th>
        <td mat-cell *matCellDef="let activity">{{ activity.location | uppercase }}</td>
      </ng-container>
      <ng-container matColumnDef="tema">
        <th mat-header-cell *matHeaderCellDef>Tema</th>
        <td mat-cell *matCellDef="let activity">{{ activity.tema | titlecase }}</td>
      </ng-container>
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Tarikh</th>
        <td mat-cell *matCellDef="let activity">{{ activity.date | date }}</td>
      </ng-container>
      <ng-container matColumnDef="organizer">
        <th mat-header-cell *matHeaderCellDef>Penganjur</th>
        <td mat-cell *matCellDef="let activity">{{ activity.organizer }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'name', 'location', 'tema', 'date', 'organizer']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'name', 'location', 'tema', 'date', 'organizer']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="6">No events yet.</td>
      </tr>
    </table>
  </div>
</mat-card>
