<nav class="breadcrumbs" aria-label="Breadcrumb">
  <a routerLink="/event">Event</a>
  <mat-icon>chevron_right</mat-icon>
  <span>Add Event</span>
</nav>
<div class="page-header">
  <h1 class="page-title">Add event</h1>
</div>
<mat-card class="surface-card narrow" appearance="outlined">
  <form class="form-stack" [formGroup]="eventForm" (ngSubmit)="sendEvent()">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput type="text" formControlName="name_activity">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Location</mat-label>
      <input matInput type="text" formControlName="location">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Tema</mat-label>
      <input matInput type="text" formControlName="tema">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Organizer</mat-label>
      <input matInput type="text" formControlName="organizer">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput type="datetime-local" formControlName="date">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Reviewer</mat-label>
      <mat-select formControlName="value">
        @for (item of lecturer; track item) {
          <mat-option [value]="item.reviewer_id">{{ item.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <div class="form-actions">
      <button matButton="filled" type="submit">Add</button>
    </div>
  </form>
</mat-card>
