<div class="page-header">
  <h1 class="page-title">Vote result</h1>
</div>
<div class="card-grid">
  @for (item of list; track item) {
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>{{ item.name_activity }}</mat-card-title>
        <mat-card-subtitle>{{ item.location }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-actions>
        <button matButton="tonal" [routerLink]="[item.activity_id,'result']" (click)="setCurrentVoteId(item.activity_id)">Check</button>
      </mat-card-actions>
    </mat-card>
  } @empty {
    <mat-card appearance="outlined"><p class="empty-state">No vote results yet.</p></mat-card>
  }
</div>
