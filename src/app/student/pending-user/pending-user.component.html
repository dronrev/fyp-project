<div class="page-header">
  <h1 class="page-title">Pending users</h1>
</div>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="list || []">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let item">{{ item.username }}</td>
      </ng-container>
      <ng-container matColumnDef="course">
        <th mat-header-cell *matHeaderCellDef>Course code</th>
        <td mat-cell *matCellDef="let item">{{ item.course_id }}</td>
      </ng-container>
      <ng-container matColumnDef="matric">
        <th mat-header-cell *matHeaderCellDef>Member ID</th>
        <td mat-cell *matCellDef="let item">{{ item.user_id }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let item">{{ item.email_id }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let item">
          <button matButton="tonal" (click)="approveMember(item)">Approve</button>
          <button matButton class="danger" (click)="deleteMember(item)">Delete</button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'name', 'course', 'matric', 'email', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'name', 'course', 'matric', 'email', 'actions']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="6">No pending users.</td>
      </tr>
    </table>
  </div>
</mat-card>
