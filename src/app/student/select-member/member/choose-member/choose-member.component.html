<div class="page-header">
  <div>
    <h1 class="page-title">Vote members</h1>
    @for (title of list; track title) {
      <p class="page-subtitle">Upcoming activity: {{ title.name_activity }}</p>
    }
  </div>
  <button matButton="filled" type="button" (click)="sending_to_db()">Send vote</button>
</div>
<div class="card-grid">
  @for (item of list_student; track item) {
    <mat-card class="surface-card member-card" appearance="outlined">
      <img class="avatar" [src]="imageURL+item.profilepic" alt="" height="96" width="96" (error)="$any($event.target).src = 'assets/images/default-image.jpg'">
      <div class="member-name">{{ item.username | uppercase }}</div>
      <mat-checkbox (change)="sendData($event,item)">Select</mat-checkbox>
    </mat-card>
  }
</div>
