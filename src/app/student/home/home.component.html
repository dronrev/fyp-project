<div class="page-header">
  <div>
    <h1 class="page-title">Welcome, {{ yourName }}</h1>
    <p class="page-subtitle">{{ appName }}</p>
  </div>
</div>
<div class="card-grid">
  <a class="link-card" routerLink="/dashboard">
    <mat-card class="surface-card" appearance="outlined">
      <div class="link-card-icon"><mat-icon>dashboard</mat-icon></div>
      <div class="link-card-title">Dashboard</div>
      <div class="link-card-text">Go to dashboard to see any updates</div>
    </mat-card>
  </a>
  <a class="link-card" routerLink="/event">
    <mat-card class="surface-card" appearance="outlined">
      <div class="link-card-icon"><mat-icon>event</mat-icon></div>
      <div class="link-card-title">Event</div>
      <div class="link-card-text">See upcoming activities</div>
    </mat-card>
  </a>
  <a class="link-card" routerLink="/report">
    <mat-card class="surface-card" appearance="outlined">
      <div class="link-card-icon"><mat-icon>description</mat-icon></div>
      <div class="link-card-title">Report</div>
      <div class="link-card-text">See and edit your reports</div>
    </mat-card>
  </a>
  <a class="link-card" routerLink="/announcement">
    <mat-card class="surface-card" appearance="outlined">
      <div class="link-card-icon"><mat-icon>campaign</mat-icon></div>
      <div class="link-card-title">Announcement</div>
      <div class="link-card-text">Read announcements about activities</div>
    </mat-card>
  </a>
  <a class="link-card" routerLink="/voting-activity">
    <mat-card class="surface-card" appearance="outlined">
      <div class="link-card-icon"><mat-icon>how_to_vote</mat-icon></div>
      <div class="link-card-title">Vote</div>
      <div class="link-card-text">Vote for the upcoming committee</div>
    </mat-card>
  </a>
</div>
