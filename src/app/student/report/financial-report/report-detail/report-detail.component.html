<form action="" [formGroup]="myData">
  <div class="container financial-form">
    <h2>LAPORAN KEWANGAN</h2>
    <div class="row">
      <div class="col">
        <h3>Pendapatan</h3>
        <ion-list [inset]="true">
          <ion-item>
            <ion-input label="PERUNTUKAN HEP" labelPlacement="floating" formControlName="peruntukan_hep"[value]="peruntukan_hep"></ion-input>
          </ion-item>
          <ion-item>
            <ion-input label="YURAN PENDAPATAN" labelPlacement="floating" formControlName="yuran_pendapatan" [value]="yuran_pendapatan"></ion-input>
          </ion-item>
          <ion-item>
            <ion-input label="PENAJA" labelPlacement="floating" formControlName="penaja" [value]="penaja"></ion-input>
          </ion-item>
        </ion-list>
        <p></p>
      </div>
      <div class="col">
        <h3>Perbelanjaan</h3>
        <ion-list [inset]="true">
          <ion-item>
            <ion-input label="SPEAKER" labelPlacement="floating" formControlName="speaker" [value]="speaker"></ion-input>
          </ion-item>
          <ion-item>
            <ion-input label="TEMPAT PERTAMA" labelPlacement="floating" formControlName="tempat_pertama" [value]="tempat_pertama"></ion-input>
          </ion-item>
          <ion-item>
            <ion-input label="TEMPAT KEDUA" labelPlacement="floating" formControlName="tempat_kedua" [value]="tempat_kedua"></ion-input>
          </ion-item>
          <ion-item>
            <ion-input label="TEMPAT KETIGA" labelPlacement="floating" formControlName="tempat_ketiga" [value]="tempat_ketiga"></ion-input>
          </ion-item>
        </ion-list>
      </div>
      <div class="send-button">
        <button class="btn btn-primary" (click)="financialData(myData.value)">Save</button>
      </div>
    </div>
  </div>
</form>
