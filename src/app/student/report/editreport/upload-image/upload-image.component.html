<div class="page-header">
  <h2 class="section-title">Attachments</h2>
  <div class="actions">
    <input #attachmentInput class="file-input" type="file" accept="image/*" (change)="uploadImage($event)" multiple>
    <button matButton="outlined" type="button" (click)="attachmentInput.click()">
      <mat-icon>add_photo_alternate</mat-icon>
      Choose images
    </button>
    <button matButton="filled" type="button" (click)="uploadImg()">Save image</button>
  </div>
</div>
<mat-card class="surface-card" appearance="outlined">
  @if (listOfImage?.length) {
    <p class="hint attachment-hint">Tick an image to mark it for removal.</p>
    <div class="image-grid">
      @for (item of listOfImage; track item) {
        <div class="attachment">
          <img [src]="item" alt="Report attachment">
          <mat-checkbox (change)="deleteImg($event,item)">Remove</mat-checkbox>
        </div>
      }
    </div>
  } @else {
    <p class="empty-state">No attachments yet. Choose images to upload.</p>
  }
</mat-card>
