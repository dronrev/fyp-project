<div class="two-column">
  <mat-card class="surface-card" appearance="outlined">
    <h2 class="section-title">Add a participant</h2>
    <form class="form-stack" [formGroup]="addStudent" (ngSubmit)="add()">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Member ID</mat-label>
        <input matInput formControlName="matric_no">
      </mat-form-field>
      <div class="form-actions">
        <button matButton="filled" type="submit">Add</button>
      </div>
    </form>
  </mat-card>
  <mat-card class="surface-card" appearance="outlined">
    <h2 class="section-title">Import from a spreadsheet</h2>
    <p class="hint">The columns of the Excel file must be named "Fullname", "Matric Number" and "Email".</p>
    <input #importInput class="file-input" type="file" (change)="importCSV($event)" accept=".xls,.xlsx,.csv">
    <div class="form-actions">
      <button matButton="outlined" type="button" (click)="importInput.click()">
        <mat-icon>upload_file</mat-icon>
        Choose file
      </button>
    </div>
  </mat-card>
</div>

<div class="page-header participants-header">
  <h2 class="section-title">List of participants</h2>
  <div class="actions">
    <button matButton="tonal" (click)="createFile()">Generate e-cert</button>
    <button matButton="outlined" (click)="download()">
      <mat-icon>download</mat-icon>
      Download certificate
    </button>
  </div>
</div>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="list || []">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let student; let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let student">{{ student.name | uppercase }}</td>
      </ng-container>
      <ng-container matColumnDef="matric">
        <th mat-header-cell *matHeaderCellDef>Member ID</th>
        <td mat-cell *matCellDef="let student">{{ student.matric_no }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let student">
          <button matButton class="danger" (click)="deleting(student.matric_no)">Delete</button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'name', 'matric', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'name', 'matric', 'actions']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="4">No participants yet.</td>
      </tr>
    </table>
  </div>
</mat-card>
