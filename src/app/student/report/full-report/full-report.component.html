<h1>List Of Report</h1>
<div class="shadow p-3 mb-5 bg-white rounded">
  <table class="table">
    <thead class="thead-dark">
      <tr>
        @for (header of TabHeaders; track header) {
          <th scope="col">
            {{ header | uppercase }}
          </th>
        }
      </tr>
    </thead>
    <tbody>
      @for (item of list; track item; let key = $index) {
        <tr scope="row">
          <td>
            {{ key+1 }}
          </td>
          <td>{{ item.name_activity }}</td>
          <td>{{ item.status }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
