<div class="page-header">
  <h1 class="page-title">List of reports</h1>
</div>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="list || []">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let item">{{ item.name_activity }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let item">
          <span class="status-chip" [class]="'status-' + item.status">{{ item.status | reportStatus }}</span>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'name', 'status']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'name', 'status']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="3">No reports yet.</td>
      </tr>
    </table>
  </div>
</mat-card>
