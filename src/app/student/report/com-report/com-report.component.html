<div class="stack">
  @for (report of reports?.slice(((a || 1) - 1) * 5, (a || 1) * 5); track report; let key = $index) {
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>
          <a class="report-link" [routerLink]="['/report/editreport',report.report_id]" (click)="getReport(((a || 1) - 1) * 5 + key)">{{ report.name_activity }}</a>
        </mat-card-title>
        <mat-card-subtitle>{{ report.location }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <span class="status-chip" [class]="'status-' + report.status">{{ report.status | reportStatus }}</span>
      </mat-card-content>
      <mat-card-actions align="end">
        <button matButton class="danger" (click)="deleteRep(report.report_id)">Delete</button>
        <button matButton="tonal" [routerLink]="['/report/editreport',report.report_id]" (click)="getReport(((a || 1) - 1) * 5 + key)">Edit</button>
      </mat-card-actions>
    </mat-card>
  } @empty {
    <mat-card appearance="outlined"><p class="empty-state">You have no reports yet.</p></mat-card>
  }
</div>
@if ((reports?.length || 0) > 5) {
  <mat-paginator [length]="reports?.length || 0" [pageSize]="5" [pageIndex]="(a || 1) - 1" hidePageSize
    (page)="a = $event.pageIndex + 1" aria-label="Report pages"></mat-paginator>
}
