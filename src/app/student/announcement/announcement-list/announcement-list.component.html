<div class="page-header">
  <h1 class="page-title">Announcement</h1>
</div>
<div class="stack">
  @for (item of list?.slice(((a || 1) - 1) * 5, (a || 1) * 5); track item; let key = $index) {
    <a class="link-card" [routerLink]="[item.announcement_id]" (click)="getAnnouncement(((a || 1) - 1) * 5 + key)">
      <mat-card class="surface-card" appearance="outlined">
        <div class="link-card-title">{{ item.title | uppercase }}</div>
        <div class="link-card-text">{{ item.subject }}</div>
        <div class="hint announcement-date">{{ item.date_created || "Unknown date" }}</div>
      </mat-card>
    </a>
  } @empty {
    <mat-card appearance="outlined"><p class="empty-state">No announcements yet.</p></mat-card>
  }
</div>
@if ((list?.length || 0) > 5) {
  <mat-paginator [length]="list?.length || 0" [pageSize]="5" [pageIndex]="(a || 1) - 1" hidePageSize
    (page)="a = $event.pageIndex + 1" aria-label="Announcement pages"></mat-paginator>
}
