<nav class="breadcrumbs" aria-label="Breadcrumb">
  <a routerLink="/announcement">Announcement</a>
  <mat-icon>chevron_right</mat-icon>
  <span>Message</span>
</nav>
<div class="stack narrow">
  @for (item of myitem; track item) {
    <mat-card class="surface-card" appearance="outlined">
      <h1 class="page-title">{{ item.title | uppercase }}</h1>
      <p class="page-subtitle">{{ item.subject }}</p>
      <mat-divider class="announcement-divider"></mat-divider>
      <p class="announcement-message">{{ item.message }}</p>
    </mat-card>
  }
</div>
