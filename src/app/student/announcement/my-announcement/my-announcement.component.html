<div class="page-header">
  <h1 class="page-title">My announcements</h1>
</div>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="list || []">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let item">{{ item.title }}</td>
      </ng-container>
      <ng-container matColumnDef="subject">
        <th mat-header-cell *matHeaderCellDef>Subject</th>
        <td mat-cell *matCellDef="let item">{{ item.subject }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let item">
          <button matButton [routerLink]="[item.announcement_id]" (click)="editAnnouncement(item.announcement_id)">Edit</button>
          <button matButton class="danger" (click)="deleteAnnouncement(item.announcement_id)">Delete</button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'title', 'subject', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'title', 'subject', 'actions']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="4">You have no announcements.</td>
      </tr>
    </table>
  </div>
</mat-card>
