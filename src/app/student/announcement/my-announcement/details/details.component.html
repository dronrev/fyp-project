<div class="page-header">
  <h1 class="page-title">Edit announcement</h1>
</div>
@for (item of myitem; track item) {
  <mat-card class="surface-card narrow" appearance="outlined">
    <form class="form-stack" [formGroup]="send_data" (ngSubmit)="saveEdit()">
      <mat-form-field appearance="outline">
        <mat-label>Title</mat-label>
        <input matInput type="text" [(ngModel)]="myitem[0].title" formControlName="title">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Subject</mat-label>
        <input matInput type="text" [(ngModel)]="myitem[0].subject" formControlName="subject">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Message</mat-label>
        <textarea matInput rows="10" [(ngModel)]="myitem[0].message" formControlName="message"></textarea>
      </mat-form-field>
      <div class="form-actions">
        <button matButton="filled" type="submit">Save</button>
      </div>
    </form>
  </mat-card>
}
