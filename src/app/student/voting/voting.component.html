<div class="page-header">
  <h1 class="page-title">Voting</h1>
</div>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="list || []">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let item">{{ item.title }}</td>
      </ng-container>
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let item">{{ item.date }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Vote</th>
        <td mat-cell *matCellDef="let item">
          <button matButton="tonal" [routerLink]="['voting-process/',item.vote_id]" (click)="selectVoting(item.vote_id)">Vote now</button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'name', 'date', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'name', 'date', 'actions']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="4">You have no voting activity.</td>
      </tr>
    </table>
  </div>
</mat-card>
