<div [hidden]="check">
  <h2 class="section-title">Summary of overall achievement</h2>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="list || []">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="director">
        <th mat-header-cell *matHeaderCellDef>Programme director</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.username }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Event completed</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.name_activity }}</td>
      </ng-container>
      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef>Location</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.location }}</td>
      </ng-container>
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Event start</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.date | date }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'director', 'name', 'location', 'date']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'director', 'name', 'location', 'date']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="5">No completed events.</td>
      </tr>
    </table>
  </div>
</mat-card>
</div>
