<mat-card class="surface-card" appearance="outlined" [hidden]="check">
  <div class="page-header chart-header">
    <h2 class="section-title">Financial summary</h2>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Year</mat-label>
      <mat-select (selectionChange)="getYear($event)">
        @for (listOfYear of year; track listOfYear) {
          <mat-option [value]="listOfYear">{{ listOfYear }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <div id="divChart">
    <canvas id="myChart" #myChart></canvas>
  </div>
</mat-card>
