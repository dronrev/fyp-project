<div [hidden]="check">
  <h2 class="section-title">Status of activity reports</h2>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="list || []">
      <ng-container matColumnDef="director">
        <th mat-header-cell *matHeaderCellDef>Programme director</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.username }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name of event</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.name_activity }}</td>
      </ng-container>
      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef>Location</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.location }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Report status</th>
        <td mat-cell *matCellDef="let item; let i = index"><span class="status-chip" [class]="'status-' + item.status">{{ item.status | reportStatus }}</span></td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['director', 'name', 'location', 'status']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['director', 'name', 'location', 'status']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="4">No activity reports.</td>
      </tr>
    </table>
  </div>
</mat-card>
</div>
