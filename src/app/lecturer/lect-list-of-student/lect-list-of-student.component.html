<div class="page-header">
  <h1 class="page-title">Members</h1>
</div>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="students || []">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let student; let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let student; let i = index">{{ student.username }}</td>
      </ng-container>
      <ng-container matColumnDef="course">
        <th mat-header-cell *matHeaderCellDef>Course code</th>
        <td mat-cell *matCellDef="let student; let i = index">{{ student.course_id }}</td>
      </ng-container>
      <ng-container matColumnDef="branch">
        <th mat-header-cell *matHeaderCellDef>Group</th>
        <td mat-cell *matCellDef="let student; let i = index">{{ student.group_id | groupName:groupNames }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'name', 'course', 'branch']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'name', 'course', 'branch']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="4">No members found.</td>
      </tr>
    </table>
  </div>
</mat-card>
