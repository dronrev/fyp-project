<table class="shadow p-3 mb-5 bg-white rounded">
  <thead>
    <th>#</th>
    <th>Name</th>
    <th>Course Code</th>
    <th>KK/Labuan</th>
  </thead>
  <tbody>
    @for (student of students; track student; let key = $index) {
      <tr>
        <td>{{key+1}}</td>
        <td>{{ student.username }}</td>
        <td>{{ student.course_id }}</td>
        <td>{{ student.cawangan }}</td>
      </tr>
    }
  </tbody>
</table>
