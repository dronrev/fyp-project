<mat-card class="surface-card" appearance="outlined">
  <h2 class="section-title">Laporan Kewangan</h2>
  <form [formGroup]="myData">
    <div class="two-column">
      <div class="form-stack">
        <h3 class="section-title">Pendapatan</h3>
      <mat-form-field appearance="outline">
        <mat-label>Peruntukan</mat-label>
        <input matInput formControlName="peruntukan_hep" [value]="peruntukan_hep" readonly>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Yuran pendapatan</mat-label>
        <input matInput formControlName="yuran_pendapatan" [value]="yuran_pendapatan" readonly>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Penaja</mat-label>
        <input matInput formControlName="penaja" [value]="penaja" readonly>
      </mat-form-field>
      </div>
      <div class="form-stack">
        <h3 class="section-title">Perbelanjaan</h3>
      <mat-form-field appearance="outline">
        <mat-label>Speaker</mat-label>
        <input matInput formControlName="speaker" [value]="speaker" readonly>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Tempat pertama</mat-label>
        <input matInput formControlName="tempat_pertama" [value]="tempat_pertama" readonly>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Tempat kedua</mat-label>
        <input matInput formControlName="tempat_kedua" [value]="tempat_kedua" readonly>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Tempat ketiga</mat-label>
        <input matInput formControlName="tempat_ketiga" [value]="tempat_ketiga" readonly>
      </mat-form-field>
      </div>
    </div>
  </form>
</mat-card>
