<mat-card class="surface-card narrow" appearance="outlined">
  <h2 class="section-title">New member</h2>
  <form class="form-stack" (ngSubmit)="sendUser(stuForm.value)" #stuForm="ngForm">
    <mat-form-field appearance="outline">
      <mat-label>Member name</mat-label>
      <input matInput type="text" ngModel name="name" required>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Member ID</mat-label>
      <input matInput type="text" ngModel name="mat_number" required>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" ngModel name="passwd" autocomplete="new-password" required>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Email address</mat-label>
      <input matInput type="text" ngModel name="email" required>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Course code</mat-label>
      <input matInput type="text" ngModel name="course_code" required>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Group</mat-label>
      <mat-select name="group_id" ngModel required>
        @for (item of groups; track item.group_id) {
          <mat-option [value]="item.group_id">{{ item.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>User role</mat-label>
      <mat-select name="role" ngModel required>
        @for (item of roles; track item.value) {
          <mat-option [value]="item.value">{{ item.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <div class="form-actions">
      <button matButton="filled" type="submit">Submit</button>
    </div>
  </form>
</mat-card>
