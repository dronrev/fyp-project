<div class="page-header">
  <h1 class="page-title">List of events</h1>
</div>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="list || []">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.name_activity }}</td>
      </ng-container>
      <ng-container matColumnDef="activity">
        <th mat-header-cell *matHeaderCellDef>Activity ID</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.activity_id }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let item; let i = index"><button matButton class="danger" (click)="deleteItem(item.activity_id)">Delete</button></td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'title', 'activity', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'title', 'activity', 'actions']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="4">No events yet.</td>
      </tr>
    </table>
  </div>
</mat-card>
