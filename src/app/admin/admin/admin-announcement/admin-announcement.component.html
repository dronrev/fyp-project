<div class="page-header">
  <h1 class="page-title">Announcement</h1>
  <a matButton="filled" routerLink="create-new">
    <mat-icon>add</mat-icon>
    Create new announcement
  </a>
</div>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="(announcements || []) | slice:((td || 1) - 1) * 5:(td || 1) * 5">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ ((td || 1) - 1) * 5 + i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.title }}</td>
      </ng-container>
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.date_created }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let item; let i = index">
          <button matButton [routerLink]="['edit/',item.announcement_id]" (click)="setAnnouncementId(item.announcement_id)">Check</button>
          <button matButton class="danger" (click)="deleteItem(item.announcement_id)">Delete</button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'title', 'date', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'title', 'date', 'actions']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="4">No announcements yet.</td>
      </tr>
    </table>
  </div>
  <mat-paginator [length]="announcements?.length || 0" [pageSize]="5" [pageIndex]="(td || 1) - 1" hidePageSize
    (page)="td = $event.pageIndex + 1" aria-label="Announcement pages"></mat-paginator>
</mat-card>
