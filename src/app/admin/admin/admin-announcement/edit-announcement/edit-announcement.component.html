<nav class="breadcrumbs" aria-label="Breadcrumb">
  <a routerLink="/admin-announcement">Announcement</a>
  <mat-icon>chevron_right</mat-icon>
  <span>Edit</span>
</nav>
<div class="page-header">
  <h1 class="page-title">Edit announcement</h1>
</div>
@if (list?.length) {
<mat-card class="surface-card narrow" appearance="outlined">
  <form class="form-stack" [formGroup]="send_data" (ngSubmit)="sendAnnouncement()">
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput type="text" formControlName="title" [(ngModel)]="list[0].title">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Subject</mat-label>
      <input matInput type="text" formControlName="subject" [(ngModel)]="list[0].subject">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Message</mat-label>
      <textarea matInput rows="10" formControlName="message" [(ngModel)]="list[0].message"></textarea>
    </mat-form-field>
    <div class="form-actions">
      <button matButton="filled" type="submit">Send</button>
    </div>
  </form>
</mat-card>
}
