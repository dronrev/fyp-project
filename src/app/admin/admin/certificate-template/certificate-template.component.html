<div class="page-header">
  <h1 class="page-title">Certificate template</h1>
  <div class="actions">
    <input #templateInput class="file-input" type="file" (change)="showImage($event)" accept="image/*">
    <button matButton="outlined" type="button" (click)="templateInput.click()">
      <mat-icon>image</mat-icon>
      Choose image
    </button>
    <button matButton="filled" type="button">Add image</button>
  </div>
</div>
<mat-card class="surface-card" appearance="outlined">
  @if (imageURL?.length) {
    <div class="image-grid">
      @for (item of imageURL; track item) {
        <div class="cert-item">
          <img [src]="'assets/images/announcement/'+item" alt="Certificate template">
          <button matButton class="danger" type="button">Remove</button>
        </div>
      }
    </div>
  } @else {
    <p class="empty-state">No certificate templates yet.</p>
  }
</mat-card>
