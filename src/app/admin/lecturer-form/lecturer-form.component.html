<mat-card class="surface-card narrow" appearance="outlined">
  <h2 class="section-title">New reviewer</h2>
  <form class="form-stack" [formGroup]="myForm">
    <mat-form-field appearance="outline">
      <mat-label>Reviewer name</mat-label>
      <input matInput type="text" name="lecturername" formControlName="name" required>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" name="password" formControlName="passwd" autocomplete="new-password" required>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Email address</mat-label>
      <input matInput type="text" name="email" formControlName="email" required>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>User role</mat-label>
      <mat-select formControlName="role">
        <mat-option value="reviewer">Reviewer</mat-option>
        <mat-option value="approver">Approver</mat-option>
      </mat-select>
    </mat-form-field>
    <div class="form-actions">
      <button matButton="filled" type="button" (click)="addLecturer()">Submit</button>
    </div>
  </form>
</mat-card>
