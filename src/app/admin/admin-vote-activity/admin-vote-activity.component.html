<div class="page-header">
  <h1 class="page-title">Voting activity</h1>
  <a matButton="filled" routerLink="/new-vote-act">
    <mat-icon>add</mat-icon>
    Create new vote event
  </a>
</div>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="list || []">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>No</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.title }}</td>
      </ng-container>
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let item; let i = index">{{ item.date }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let item; let i = index">
          <button matButton [routerLink]="['vote-acti/',item.vote_id]" (click)="edit(item.vote_id)">Edit</button>
          <button matButton [routerLink]="['vote-detail/',item.vote_id]" (click)="detail(item.vote_id,item.group_id)">Result</button>
          <button matButton class="danger" (click)="deleteVote(item.vote_id)">Delete</button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'title', 'date', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'title', 'date', 'actions']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="4">No vote events yet.</td>
      </tr>
    </table>
  </div>
</mat-card>
