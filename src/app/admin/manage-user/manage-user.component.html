<div class="page-header">
  <h1 class="page-title">Manage user</h1>
</div>
<mat-card class="table-card" appearance="outlined">
  <div class="table-scroll">
    <table mat-table [dataSource]="(students || []) | slice:((td || 1) - 1) * 5:(td || 1) * 5">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let student; let i = index">{{ ((td || 1) - 1) * 5 + i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let student; let i = index">{{ student.username }}</td>
      </ng-container>
      <ng-container matColumnDef="course">
        <th mat-header-cell *matHeaderCellDef>Course code</th>
        <td mat-cell *matCellDef="let student; let i = index">{{ student.course_id }}</td>
      </ng-container>
      <ng-container matColumnDef="branch">
        <th mat-header-cell *matHeaderCellDef>Group</th>
        <td mat-cell *matCellDef="let student; let i = index">{{ student.group_id | groupName:groupNames }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let student; let i = index"><button matButton class="danger" (click)="deleteUser(student.user_id)">Delete</button></td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['index', 'name', 'course', 'branch', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index', 'name', 'course', 'branch', 'actions']"></tr>
      <tr *matNoDataRow>
        <td class="empty-state" colspan="5">No users found.</td>
      </tr>
    </table>
  </div>
  <mat-paginator [length]="students?.length || 0" [pageSize]="5" [pageIndex]="(td || 1) - 1" hidePageSize
    (page)="td = $event.pageIndex + 1" aria-label="User pages"></mat-paginator>
</mat-card>
