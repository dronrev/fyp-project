<div class="page-header">
  <h1 class="page-title">Register user</h1>
</div>
<mat-button-toggle-group class="register-toggle" aria-label="User type" hideSingleSelectionIndicator>
  <mat-button-toggle value="student" [checked]="student" (change)="onStudent()">Member</mat-button-toggle>
  <mat-button-toggle value="lecturer" [checked]="lecturer" (change)="onLecturer()">Reviewer</mat-button-toggle>
</mat-button-toggle-group>
@if (student) {
  <app-student-form></app-student-form>
}
@if (lecturer) {
  <app-lecturer-form></app-lecturer-form>
}
@if (!student && !lecturer) {
  <mat-card class="narrow" appearance="outlined"><p class="empty-state">Choose the type of user to register.</p></mat-card>
}
