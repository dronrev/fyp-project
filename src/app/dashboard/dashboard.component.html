<div class="auth-page">
  <mat-card class="auth-card landing-card">
    <div class="auth-brand">
      <span class="auth-mark"><mat-icon>event_available</mat-icon></span>
      <h1>{{ appName }}</h1>
      <p>Upcoming activities</p>
    </div>
    @if (myEvent.length) {
      <mat-list>
        @for (item of myEvent; track item) {
          <mat-list-item>
            <mat-icon matListItemIcon>event</mat-icon>
            <span matListItemTitle>{{ item.name_activity | titlecase }}</span>
            <span matListItemLine>{{ item.date | date }}</span>
          </mat-list-item>
        }
      </mat-list>
    } @else {
      <p class="empty-state">No upcoming activities yet.</p>
    }
    <div class="form-actions landing-actions">
      <a matButton="filled" routerLink="/sign-in">Login</a>
      <a matButton routerLink="/new-register">Register</a>
    </div>
  </mat-card>
</div>
