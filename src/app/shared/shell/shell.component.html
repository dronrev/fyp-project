<mat-sidenav-container class="shell">
  <mat-sidenav #sidenav class="shell-sidenav"
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="!isHandset">
    <div class="shell-brand">
      <span class="shell-brand-mark"><mat-icon>event_available</mat-icon></span>
      <div>
        <div class="shell-brand-name">{{ appShortName }}</div>
        <div class="shell-brand-sub">{{ appName }}</div>
      </div>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.link) {
        <a mat-list-item [routerLink]="item.link" routerLinkActive #active="routerLinkActive"
          [activated]="active.isActive" (click)="isHandset && sidenav.close()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar class="shell-toolbar">
      @if (isHandset) {
        <button matIconButton (click)="sidenav.toggle()" aria-label="Open menu">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="shell-toolbar-title">{{ appShortName }}</span>
      }
      <span class="shell-spacer"></span>
      <button class="shell-user" [matMenuTriggerFor]="userMenu">
        @if (avatarUrl) {
          <img class="shell-avatar" [src]="avatarUrl" alt="">
        } @else {
          <mat-icon class="shell-avatar-icon">account_circle</mat-icon>
        }
        <span class="shell-user-text">
          <span class="shell-user-name">{{ userName || roleLabel }}</span>
          @if (userName && roleLabel) {
            <span class="shell-user-role">{{ roleLabel }}</span>
          }
        </span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        @if (profileLink) {
          <a mat-menu-item [routerLink]="profileLink">
            <mat-icon>person</mat-icon>
            <span>Profile</span>
          </a>
        }
        <button mat-menu-item (click)="signOut()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="shell-main">
      <ng-content></ng-content>
    </main>

    <footer class="shell-footer">
      <span>&copy; {{ year }} {{ appName }}</span>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
